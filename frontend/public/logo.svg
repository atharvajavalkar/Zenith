<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" aria-hidden="true">
  <!--
    Zenith mark — the peak.
    Purpose: precision gold intelligence at market height.
    Motto: rise to the point that matters.
  -->
  <g stroke="#c9a66b" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer ascent -->
    <path d="M12 48 L32 12 L52 48" stroke-width="1.75"/>
    <!-- Inner ascent (precision / second confirmation) -->
    <path d="M20 48 L32 24 L44 48" stroke-width="1.1" opacity="0.55"/>
  </g>
  <!-- Zenith point — the gold decision -->
  <circle cx="32" cy="12" r="2.35" fill="#c9a66b"/>
  <!-- Quiet horizon — the market floor -->
  <path d="M16 52 H48" stroke="#c9a66b" stroke-width="1" stroke-linecap="round" opacity="0.35"/>
</svg>
